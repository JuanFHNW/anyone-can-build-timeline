<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Timeline</h1>

    <div class="name-row">
      <label for="author">Your name</label>
      <input id="author" type="text" autocomplete="off" placeholder="Aiko">
    </div>

    <form id="post-form">
      <label for="text">What is happening?</label>
      <textarea id="text" rows="3" placeholder="What is happening?"></textarea>
      <div class="post-row">
        <span id="count" class="count">0 / 280</span>
        <div>
          <button id="cancel-edit" class="cancel-button" type="button" hidden>Cancel</button>
          <button id="submit-post" type="submit">Post</button>
        </div>
      </div>
    </form>

    <p id="status" class="status" role="status"></p>

    <ol id="timeline" class="timeline" aria-label="Posts, newest first"></ol>
  </main>

  <script src="app.js"></script>
</body>
</html>
